# kafedra-assistant — https://tregubovvn.ru/kafedra-assistant
#
# Приложение статическое (Next.js export): Node/PM2 не нужны, nginx просто отдаёт файлы
# из /var/www/html/kafedra-assistant.
#
# Куда положить:
#   A) если для tregubovvn.ru ещё нет своего server{} —
#        sudo cp kafedra-assistant.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/kafedra-assistant.conf /etc/nginx/sites-enabled/
#   B) если сайт tregubovvn.ru уже описан в другом файле — НЕ создавайте второй server
#      с тем же server_name (nginx возьмёт только первый). Скопируйте в его server{} блоки
#      location из этой секции, начиная с "location = /kafedra-assistant".
#
# Проверка и перезагрузка:
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: sudo certbot --nginx -d tregubovvn.ru (certbot сам добавит listen 443).

server {
    listen 80;
    listen [::]:80;
    server_name tregubovvn.ru www.tregubovvn.ru;

    root /var/www/html;
    index index.html;

    # Остальные сайты/каталоги этого домена (blitz_v2 и т.п.) — как настроены сейчас.

    # --- kafedra-assistant -------------------------------------------------

    # Канонический адрес без слэша: Next собирает ссылки от /kafedra-assistant
    location = /kafedra-assistant {
        return 301 /kafedra-assistant/;
    }

    # Статика приложения
    location /kafedra-assistant/ {
        try_files $uri $uri/ /kafedra-assistant/index.html;
    }

    # Хэшированные бандлы Next можно кэшировать надолго
    location /kafedra-assistant/_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # config.js правится на сервере (anon key, пароль) — не кэшируем
    location = /kafedra-assistant/config.js {
        add_header Cache-Control "no-store";
    }

    # В каталоге лежат .env и исходники — dotfiles наружу не отдаём
    location ~ /\.(?!well-known) {
        deny all;
    }

    # -----------------------------------------------------------------------
}
