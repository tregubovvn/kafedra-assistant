# Готовый GitHub Actions workflow.
# Положить в .github/workflows/main.yml (правка этого пути требует токен со scope `workflow`).
# Секреты репозитория: HOST, USERNAME, SSH_PRIVATE_KEY.
#
# Сборка НЕ выполняется: в репозитории уже лежит готовая статика в site/
# (обновляется локально: npm run build:static && npm run publish:static).

name: Deploy kafedra-assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Copy static site via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "site/*"
          target: "/var/www/html/kafedra-assistant"
