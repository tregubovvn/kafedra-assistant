# Готовый GitHub Actions workflow для деплоя статики.
# Положить в .github/workflows/main.yml (правка этого пути требует токен со scope `workflow`).
# Секреты репозитория: HOST, USERNAME, SSH_PRIVATE_KEY.

name: Deploy kafedra-assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build static site
        run: |
          npm ci
          npm run build:static

      - name: Copy static files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "out/."
          target: "/var/www/html/kafedra-assistant"
          # config.js живёт только на сервере (в репозитории его нет), поэтому он не перезаписывается
