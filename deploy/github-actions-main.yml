# Готовый GitHub Actions workflow для деплоя.
# Положить в .github/workflows/main.yml (правка этого пути требует токен со scope `workflow`).
# Секреты репозитория: HOST, USERNAME, SSH_PRIVATE_KEY (те же, что уже используются).

name: Deploy kafedra-assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Copy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/var/www/html/kafedra-assistant"

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/html/kafedra-assistant
            export NEXT_PUBLIC_BASE_PATH=/kafedra-assistant
            npm ci
            npm run db:push
            npm run build:server
            if pm2 describe kafedra >/dev/null 2>&1; then
              pm2 restart kafedra --update-env
            else
              pm2 start npm --name kafedra -- run start:server
            fi
            pm2 save
